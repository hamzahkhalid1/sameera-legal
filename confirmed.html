<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email confirmed — BOCA</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>:root{--ink:#1c2430;--soft:#5b6472;--navy:#1f3a5f;--line:#e7e2d8;--bg:#f7f3ea}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;text-align:center;padding:24px}
main{max-width:380px}
.brand{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:15px;letter-spacing:.16em;color:var(--navy);margin:0}
.mark{width:64px;height:64px;border-radius:50%;background:var(--navy);color:#f4efe3;display:flex;align-items:center;justify-content:center;margin:24px auto 0;font-size:30px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:30px;line-height:1.2;margin:20px 0 8px}
p{color:var(--soft);margin:0}</style>
</head>
<body>
<main>
<p class="brand">BOCA</p>
<div class="mark" id="mark">✓</div>
<h1 id="title">Email confirmed</h1>
<p id="body">You’re all set. Go back to the BOCA app and sign in.</p>
</main>
<script>
// Supabase sends people here after they tap the link in the confirmation email; an old or used link comes back with an error.
var q = new URLSearchParams(location.search + '&' + location.hash.slice(1))
if (q.get('error') || q.get('error_code')) {
  document.getElementById('mark').textContent = '!'
  document.getElementById('title').textContent = 'This link has expired'
  document.getElementById('body').textContent = 'Open BOCA and sign in — we’ll email you a fresh confirmation link.'
}
history.replaceState(null, '', location.pathname)
</script>
</body>
</html>
