<style>:root{--ink:#1c2430;--soft:#5b6472;--navy:#1f3a5f;--line:#e7e2d8;--bg:#ffffff}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{border-bottom:1px solid var(--line)}
header div,main,footer{max-width:760px;margin:0 auto;padding:0 20px}
header div{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:20px;letter-spacing:.04em;color:var(--navy);text-decoration:none}
nav a{color:var(--soft);text-decoration:none;font-size:14px;margin-left:18px}nav a[aria-current]{color:var(--navy);font-weight:600}
main{padding-top:36px;padding-bottom:56px}
main>p:first-child{text-transform:uppercase;letter-spacing:.12em;font-size:13px;font-weight:600;color:var(--navy);margin:0}
h1{font-family:Georgia,"Times New Roman",serif;font-size:38px;line-height:1.15;margin:8px 0 4px}
h1+p{color:var(--soft);font-size:14px;margin-top:0}
h2{font-family:Georgia,"Times New Roman",serif;font-size:24px;margin:40px 0 8px}h3{font-size:16px;margin:22px 0 4px}
ul{padding-left:22px}li{margin:6px 0}a{color:var(--navy)}
footer{border-top:1px solid var(--line);padding-top:20px;padding-bottom:40px;color:var(--soft);font-size:14px}
@media (max-width:480px){h1{font-size:30px}h2{font-size:21px}nav a{margin-left:12px}}</style>
</head>
<body>
